name: Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    name: Deploy Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: MAVEN_USERNAME # env variable for username in deploy
          server-password: MAVEN_CENTRAL_TOKEN # env variable for token in deploy
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 'rml-dev-server/package-lock.json'
      - name: Set project version from tag
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          # Remove leading 'v' if present (e.g. v0.1.4 -> 0.1.4)
          TAG_VERSION="${TAG_VERSION#v}"
          
          echo "Updating pom.xml version to: $TAG_VERSION"
          mvn versions:set -DnewVersion="$TAG_VERSION" -DgenerateBackupPoms=false -B
      - name: Deploy Maven package
        # Locally run instead: mvn clean deploy -DskipTests -Pdeploy -Dgpg.passphrase=""
        run: mvn deploy -B -Pdeploy -Dgpg.signer=bc -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          # ASCII-armored secret key (TSK), e.g. from `gpg --armor --export-secret-keys YOUR_ID`
          MAVEN_GPG_KEY: ${{ secrets.GPG_ARMOR_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Package VS Code Extension (VSIX)
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          # Strip '-rc.*' to get VS Code compatible version https://code.visualstudio.com/api/working-with-extensions/publishing-extension#pre-release-extensions
          TAG_VERSION_VS="${TAG_VERSION%%-*}"
          
          # Add --pre-release flag if this is a pre-release version
          PRE_RELEASE_FLAG=""
          if [[ "$TAG_VERSION" == *"-"* ]]; then
            PRE_RELEASE_FLAG="--pre-release"
          fi

          cd rml-dev-server
          # Sync package.json version with tag version
          npm version "$TAG_VERSION_VS" --no-git-tag-version --allow-same-version
          npm pkg set serverVersion="$TAG_VERSION"

          # Bundle fat JAR with the extension
          mkdir -p server
          cp ../target/burp.jar server/burp.jar

          # Install dependencies and package into target VSIX
          npm ci
          npm run package -- $PRE_RELEASE_FLAG --out "rml-dev-server-$TAG_VERSION.vsix"
      - name: JReleaser Release
        run: mvn jreleaser:full-release -B -Pdeploy
        env:
          TAG_NAME: ${{ github.ref }}
          JRELEASER_PROJECT_VERSION: ${{ github.ref }}
          JRELEASER_JBANG_GITHUB_TOKEN: ${{ secrets.JBANG_CATALOG_TOKEN }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
